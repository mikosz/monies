[package]
name = "monies"
version = "0.1.0"
edition = "2024"
build = "build.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# `raw-window-handle-06` lets the file dialog be modal to the main window.
slint = { version = "1.18", features = ["raw-window-handle-06"] }
# `clock` provides today's date.
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
# Ids are UUIDv7: unique across devices (for sync) and ordered by creation.
uuid = { version = "1.26", features = ["v7"] }
# Reads import files, see docs/import-format.md.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# `bundled` compiles SQLite in; `chrono` maps NaiveDate to ISO text; `uuid` maps Uuid to BLOB.
rusqlite = { version = "0.40", features = ["bundled", "chrono", "uuid"] }
directories = "6"
# The native dialog for picking an import file.
rfd = "0.17.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Globalization"] }

[build-dependencies]
slint-build = "1.18"

[dev-dependencies]
# Reads the sample data in examples/sample_db.
csv = "1.4"

[lib]
# Distinct from the binary's name so their outputs (e.g. .pdb on Windows) don't collide.
name = "monies_app"
